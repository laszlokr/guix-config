services:

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
    volumes:
      - /data/docker/automation/n8n:/home/node/.n8n
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # n8n and gotify don't talk to each other, so there's no need for a
    # stack-specific network -- attach to podman's pre-existing default
    # bridge instead of `networks: [internal]`, which would call `podman
    # network create` and hit a real bug in this Guix build's podman/
    # netavark pairing (podman 6.0.1 / netavark 1.14.1): `network create`
    # invokes netavark with an argument it doesn't understand ("error:
    # unrecognized subcommand 'create'"), confirmed happening identically
    # as root and as a regular user, so it's not a local config gap.
    network_mode: bridge

  gotify:
    image: gotify/server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
    volumes:
      - /data/docker/automation/gotify:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    network_mode: bridge
