services:

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
    volumes:
      - /data/docker/automation/n8n:/home/node/.n8n
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # netavark's actual network-attachment call is broken in this Guix
    # build -- confirmed with a bare `podman run alpine`, no compose
    # involved, failing the same way ("failed to load network options:
    # invalid type: sequence, expected a map"). Not specific to a custom
    # network or to this stack: ANY bridge-networked container hits it.
    # `network_mode: host` sidesteps netns/netavark entirely, at the cost
    # of losing per-container port remapping -- n8n listens on 5678
    # either way, so no `ports:` mapping is needed anymore.
    network_mode: host

  gotify:
    image: gotify/server:latest
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
      # Under host networking there's no port remapping, so gotify has to
      # be told to listen on 8090 directly instead of its default (80).
      GOTIFY_SERVER_PORT: "8090"
    volumes:
      - /data/docker/automation/gotify:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    network_mode: host
